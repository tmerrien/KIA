<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0b24" />
  <meta name="description" content="Moonwharf: run a frontier spaceport on a crescent moon, from dock worker to shipwright." />
  <title>Moonwharf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" aria-label="Halfmoon Wharf map. Tap to walk and work; hold a construction site to pour coins." role="img"></canvas>
      <header id="hud">
        <div class="hud-l">
          <div id="coins" class="pill coins" aria-live="polite"><span id="coin-icon"></span><span id="coin-n" class="num">0</span><span class="sr">coins</span></div>
          <div id="era" class="era-badge">Era I · Scavenger</div>
        </div>
        <div class="hud-r">
          <button id="btn-satchel" class="hbtn" type="button" aria-label="Satchel"><span class="ic"></span><span id="satchel-n" class="num">0/10</span></button>
          <button id="btn-tech" class="hbtn" type="button" aria-label="Tech tree"><span class="ic"></span><span class="lbl">Tech</span></button>
          <button id="btn-sound" class="hbtn sq" type="button" aria-label="Mute sound" aria-pressed="false"><span class="ic"></span></button>
        </div>
      </header>
      <div id="toasts" role="status" aria-live="polite"></div>
    </div>
    <section id="panel" aria-label="Details">
      <div id="panel-inner"></div>
    </section>
  </div>
  <div id="tech" role="dialog" aria-modal="true" aria-labelledby="tech-title" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <div><h2 id="tech-title">The Job Board</h2><p id="tech-sub" class="sub"></p></div>
        <button id="tech-close" class="hbtn sq" type="button" aria-label="Close tech tree"></button>
      </div>
      <div id="tech-body" class="sheet-b"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

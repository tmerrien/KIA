<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Moonwharf Render Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #120c2c; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px;
      background: rgba(30, 22, 50, 0.85); border: 2px solid #2a2236; border-radius: 18px; color: #ffd76a;
      font: 800 16px ui-rounded, system-ui, sans-serif; pointer-events: none; }
    #hud i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff6d0 0 15%, #ffd76a 16% 60%, #e8a93a 61%); border: 2px solid #2a2236; }
    #help { position: fixed; right: 10px; bottom: 10px; color: #cfc8e6; font: 12px system-ui, sans-serif; opacity: 0.7; pointer-events: none; text-align: right; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><i></i><span id="coins">12,480</span></div>
  <div id="help">drag to pan · wheel to zoom · tap to select · hold P to pour</div>
  <script type="module" src="./preview.ts"></script>
</body>
</html>

<title>Pour Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-bleed meadow canvas; coin HUD pinned top, plot panel pinned bottom. Single deliberate daylight look. */
:root{
  --meadow:#5fa85a; --meadow-deep:#3f7f45; --cream:#fff7e6; --ink:#2f2a22;
  --gold:#f5b82e; --gold-deep:#c98a12; --panel:#fffaf0; --muted:#7a6f5c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--meadow);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.pill{pointer-events:auto;background:var(--cream);border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px}
#coinIcon{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,var(--gold) 55%,var(--gold-deep));box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);display:grid;place-items:center;font:700 15px var(--display);color:#8a5a00}
#coins{font:700 22px var(--display);font-variant-numeric:tabular-nums;line-height:1}
#rate{font:600 12px var(--body);color:var(--muted);line-height:1}
.grow{flex:1}
.btn{pointer-events:auto;border:0;border-radius:14px;background:var(--cream);color:var(--ink);font:700 14px var(--display);padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#fest{background:#ffd8f0}
#panel{position:absolute;left:0;right:0;bottom:0;height:178px;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -4px 0 rgba(0,0,0,.12);
  padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
#panel h2{margin:0;font:700 20px var(--display);text-wrap:balance}
#panel .sub{color:var(--muted);font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.stat{background:#f3ead6;border-radius:10px;padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display)}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.type{border:0;border-radius:14px;background:#f3ead6;padding:8px 6px;font:600 12px var(--body);color:var(--ink);text-align:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.type b{display:block;font:700 14px var(--display)}
.type[disabled]{opacity:.45;cursor:default}
.type:focus-visible{outline:3px solid var(--ink)}
.hint{margin-top:10px;font:700 15px var(--display);color:var(--gold-deep)}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:8px 14px;border-radius:12px;font:600 14px var(--body);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="pill"><div id="coinIcon">¢</div><div><div id="coins">0</div><div id="rate">0 / sec</div></div></div>
    <div class="grow"></div>
    <button class="btn" id="fest" hidden>Festival</button>
    <button class="btn" id="mute" aria-label="Toggle sound">Sound on</button>
  </div>
  <div id="panel"></div>
  <div id="toast"></div>
</div>

<script>
(()=>{
const COLS=4, ROWS=5, MAXSTAGE=5;
const TYPES=[
  {id:'field',  name:'Wheat Field', cost:10,    inc:1,     likes:{mill:.5},                desc:'Steady grain. Loves a windmill next door.'},
  {id:'mill',   name:'Windmill',    cost:150,   inc:8,     likes:{field:.25},              desc:'Grinds flour. Fields beside it earn +50%.'},
  {id:'bakery', name:'Bakery',      cost:2000,  inc:60,    likes:{mill:.5,field:.25},      desc:'Bread from flour. Wants a windmill close.'},
  {id:'market', name:'Market',      cost:25000, inc:450,   likes:{bakery:.5,field:.25},    desc:'Sells everything. Bakeries nearby help.'},
  {id:'workshop',name:'Workshop',   cost:3e5,   inc:3500,  likes:{mill:.5,market:.5},      desc:'Tools and wheels. Likes mills and markets.'},
  {id:'bank',   name:'Bank',        cost:4e6,   inc:30000, likes:{market:1,workshop:.5},   desc:'Money makes money. Markets double it.'}
];
const T=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const NAMES=Object.fromEntries(TYPES.map(t=>[t.id,t.name]));

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const hud=$('hud'), panel=$('panel');

let S;
function fresh(seeds=0){
  const plots=[];
  for(let i=0;i<COLS*ROWS;i++) plots.push({st:'locked',type:null,stage:0,fill:0});
  plots[2*COLS+1].st='empty'; plots[2*COLS+2].st='empty';
  return {coins:10,run:0,total:0,seeds,plots,cleared:0,muted:false,last:Date.now(),seen:false};
}
function load(){
  try{const raw=localStorage.getItem('pourvalley1'); if(raw){const s=JSON.parse(raw); if(s&&s.plots&&s.plots.length===COLS*ROWS) return s;}}catch(e){}
  return fresh();
}
function save(){S.last=Date.now(); try{localStorage.setItem('pourvalley1',JSON.stringify(S))}catch(e){}}
S=load();

// ---------- economy ----------
const frontier=i=>neighbors(i).some(n=>S.plots[n].st!=='locked');
const clearCost=()=>Math.round(30*Math.pow(4,S.cleared));
function cost(p){
  if(p.st==='locked') return clearCost();
  if(p.st!=='built'||p.stage>=MAXSTAGE) return null;
  return T[p.type].cost*Math.pow(4,p.stage);
}
function neighbors(i){
  const x=i%COLS,y=(i/COLS)|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1); if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}
function bonus(i){
  const p=S.plots[i]; if(p.st!=='built') return 0;
  const likes=T[p.type].likes; let b=0;
  for(const n of neighbors(i)){const q=S.plots[n]; if(q.st==='built'&&q.stage>0&&likes[q.type]) b+=likes[q.type];}
  return b;
}
function inc(i){
  const p=S.plots[i]; if(p.st!=='built'||p.stage<1) return 0;
  return T[p.type].inc*Math.pow(2.5,p.stage-1)*(1+bonus(i))*(1+.1*S.seeds);
}
const totalInc=()=>S.plots.reduce((a,_,i)=>a+inc(i),0);
function unlocked(id){
  const idx=TYPES.findIndex(t=>t.id===id); if(idx===0) return true;
  const prev=TYPES[idx-1].id; return S.plots.some(p=>p.st==='built'&&p.type===prev&&p.stage>=1);
}
const festGain=()=>Math.floor(Math.sqrt(S.run/1e5));
function earn(n){S.coins+=n;S.run+=n;S.total+=n;}

function fmt(n){
  if(n<1000) return (n<10&&n%1? n.toFixed(1): Math.floor(n)).toString();
  const u=['K','M','B','T','Qa','Qi','Sx']; let k=-1;
  while(n>=1000&&k<u.length-1){n/=1000;k++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[k];
}

// ---------- layout ----------
let W=0,H=0,DPR=1,tile=0,gx=0,gy=0;
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  W=cv.clientWidth;H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR;
  const top=hud.getBoundingClientRect().bottom-cv.getBoundingClientRect().top+4;
  const bot=panel.getBoundingClientRect().top-cv.getBoundingClientRect().top-6;
  const aw=W-24, ah=bot-top;
  tile=Math.floor(Math.min(aw/COLS, ah/ROWS));
  gx=(W-tile*COLS)/2; gy=top+(ah-tile*ROWS)/2;
}
window.addEventListener('resize',layout);
const tileXY=i=>({x:gx+(i%COLS)*tile, y:gy+((i/COLS)|0)*tile});
function coinSrc(){const r=$('coinIcon').getBoundingClientRect(),c=cv.getBoundingClientRect();return{x:r.left-c.left+r.width/2,y:r.top-c.top+r.height/2};}

// ---------- fx state ----------
const fx={pop:new Array(COLS*ROWS).fill(0), wob:new Array(COLS*ROWS).fill(0), bub:new Array(COLS*ROWS).fill(null), btimer:Array.from({length:COLS*ROWS},()=>4+Math.random()*8)};
let parts=[], floats=[], sel=-1, hold=null, time=0;

// ---------- audio ----------
let ac=null,lastBlip=0;
function audio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state==='suspended') ac.resume(); }
function tone(f,d=.06,v=.05,type='sine'){
  if(!ac||S.muted) return; const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}
function chord(){[523,659,784,1047].forEach((f,k)=>setTimeout(()=>tone(f,.25,.06,'triangle'),k*60));}

// ---------- toast ----------
let toastT=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}

// ---------- actions ----------
function levelUp(i){
  const p=S.plots[i];
  if(p.st==='locked'){p.st='empty';S.cleared++;p.fill=0;toast('Land cleared. Tap it to build.');sel=i;}
  else {p.stage++;p.fill=0; if(p.stage===1) toast(NAMES[p.type]+' is open for business!');}
  fx.pop[i]=1; chord();
  const {x,y}=tileXY(i);
  for(let k=0;k<26;k++){const a=Math.random()*Math.PI*2,s=80+Math.random()*180;
    parts.push({kind:'spark',x:x+tile/2,y:y+tile*.55,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,t:0,d:.8+Math.random()*.4,c:['#ffd34d','#fff','#ff9ec7','#8be0ff'][k%4]});}
  if(hold&&hold.i===i) hold.pause=.35;
  renderPanel(true); save();
}
function collectBubble(i){
  const b=fx.bub[i]; if(!b) return; fx.bub[i]=null; fx.btimer[i]=8+Math.random()*10;
  earn(b.v); const {x,y}=tileXY(i), s=coinSrc();
  floats.push({x:x+tile/2,y:y+tile*.1,t:0,txt:'+'+fmt(b.v)});
  for(let k=0;k<10;k++) parts.push({kind:'coinback',sx:x+tile/2+(Math.random()-.5)*20,sy:y+tile*.15,ex:s.x,ey:s.y,t:-k*.03,d:.55});
  tone(880,.08,.05);setTimeout(()=>tone(1320,.1,.04),70);
}
function pick(px,py){
  // bubbles first
  for(let i=0;i<S.plots.length;i++){const b=fx.bub[i]; if(!b) continue; const {x,y}=tileXY(i);
    const bx=x+tile*.78, by=y+tile*.2; if(Math.hypot(px-bx,py-by)<tile*.22) return {bubble:i};}
  const cx=Math.floor((px-gx)/tile), cy=Math.floor((py-gy)/tile);
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return null;
  return {tile:cy*COLS+cx};
}
cv.addEventListener('pointerdown',e=>{
  audio(); e.preventDefault();
  const r=cv.getBoundingClientRect(), h=pick(e.clientX-r.left,e.clientY-r.top);
  if(!h) return;
  if(h.bubble!==undefined){collectBubble(h.bubble);return;}
  const i=h.tile,p=S.plots[i]; sel=i; S.seen=true;
  if((p.st==='locked'&&frontier(i))||(p.st==='built'&&p.stage<MAXSTAGE)){hold={i,t:0,pause:0,emit:0,warned:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  renderPanel(true);
});
const endHold=()=>{hold=null;};
cv.addEventListener('pointerup',endHold);cv.addEventListener('pointercancel',endHold);
cv.addEventListener('contextmenu',e=>e.preventDefault());

$('mute').onclick=()=>{S.muted=!S.muted;$('mute').textContent=S.muted?'Sound off':'Sound on';save();};
$('mute').textContent=S.muted?'Sound off':'Sound on';
let festArm=0;
$('fest').onclick=()=>{
  const g=festGain(); if(g<1) return;
  if(Date.now()-festArm>3000){festArm=Date.now();$('fest').textContent='Tap again: reset for +'+g+' seeds';return;}
  const seeds=S.seeds+g, muted=S.muted; S=fresh(seeds); S.muted=muted; S.seen=true; sel=-1;
  fx.bub.fill(null); toast('Harvest Festival! Income now +'+(seeds*10)+'%'); chord(); save(); renderPanel(true);
};

// ---------- panel ----------
let panelKey='';
function renderPanel(force){
  const p=sel>=0?S.plots[sel]:null;
  let html='';
  if(!p){
    html=`<h2>Pour Valley</h2><div class="sub">Hold the cleared land and pour your coins in. Everything you build earns more coins.</div>
      <div class="hint">${S.seen?'Tap a plot to see what it does.':'Tap the bare plot in the middle to start.'}</div>`;
  } else if(p.st==='locked'){
    html=!frontier(sel)?`<h2>Wild forest</h2><div class="sub">Too far away. Clear the land next to your town first.</div>`:`<h2>Overgrown land</h2><div class="sub">Clear it to make room for another building.</div>
      <div class="row"><span class="stat">Clear for <b>${fmt(clearCost())}</b></span><span class="stat">Poured <b>${fmt(p.fill)}</b></span></div>
      <div class="hint">Hold the plot to pour coins in.</div>`;
  } else if(p.st==='empty'){
    html=`<h2>Empty plot</h2><div class="sub">Pick what to build, then hold the plot to pour.</div><div class="types">`+
      TYPES.map(t=>{const ok=unlocked(t.id);const prev=TYPES[TYPES.indexOf(t)-1];
        return `<button class="type" data-t="${t.id}" ${ok?'':'disabled'}><b>${t.name}</b>${ok?fmt(t.cost):'Open a '+prev.name}</button>`;}).join('')+`</div>`;
  } else {
    const t=T[p.type], c=cost(p), b=bonus(sel);
    const likes=Object.entries(t.likes).map(([k,v])=>NAMES[k]+' +'+Math.round(v*100)+'%').join(', ');
    html=`<h2>${t.name} ${p.stage?'· Level '+p.stage:'· Foundation'}</h2><div class="sub">${t.desc}</div>
      <div class="row">
        <span class="stat">Earns <b>${fmt(inc(sel))}</b>/s</span>
        ${c!==null?`<span class="stat">${p.stage?'Next level':'Build'}: <b>${fmt(p.fill)} / ${fmt(c)}</b></span>`:'<span class="stat"><b>Max level</b></span>'}
        <span class="stat">Neighbor bonus <b>+${Math.round(b*100)}%</b></span>
      </div>
      <div class="sub" style="margin-top:8px">Likes neighbors: ${likes}</div>
      ${c!==null?'<div class="hint">Hold the building to pour.</div>':''}`;
  }
  if(force||html!==panelKey){panel.innerHTML=html;panelKey=html;
    panel.querySelectorAll('.type').forEach(b=>b.onclick=()=>{
      audio(); const pp=S.plots[sel]; if(pp.st!=='empty') return;
      pp.st='built';pp.type=b.dataset.t;pp.stage=0;pp.fill=0;fx.pop[sel]=.6;tone(660,.1,.05);save();renderPanel(true);
    });
  }
}

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function tree(x,y,s){ctx.fillStyle='#6b4a2b';ctx.fillRect(x-s*.06,y-s*.25,s*.12,s*.25);
  ctx.fillStyle='#2f6e3a';ctx.beginPath();ctx.arc(x,y-s*.38,s*.24,0,7);ctx.fill();ctx.fillStyle='#3d8a46';ctx.beginPath();ctx.arc(x-s*.06,y-s*.44,s*.15,0,7);ctx.fill();}
function house(cx,by,w,h,wall,roof,floors){
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(cx,by,w*.62,w*.14,0,0,7);ctx.fill();
  ctx.fillStyle=wall;rr(cx-w/2,by-h,w,h,3);ctx.fill();
  ctx.fillStyle='#7fb6d9';const fh=h/floors;
  for(let f=0;f<floors;f++){const wy=by-fh*(f+1)+fh*.28;const n=w>40?3:2;for(let k=0;k<n;k++){const wx=cx-w/2+(k+.5)*(w/n)-w*.07;ctx.fillRect(wx,wy,w*.14,fh*.38);}}
  ctx.fillStyle='#6b4a2b';ctx.fillRect(cx-w*.09,by-fh*.5,w*.18,fh*.5);
  ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(cx-w/2-w*.1,by-h);ctx.lineTo(cx,by-h-w*.42);ctx.lineTo(cx+w/2+w*.1,by-h);ctx.closePath();ctx.fill();
  return by-h-w*.42;
}
function drawBuilding(i,p,x,y,s){
  const cx=x+s/2, by=y+s*.8, st=p.stage;
  if(st===0){ // foundation: ghost of level 1 rising with fill
    const c=cost(p), f=c?p.fill/c:0;
    ctx.fillStyle='#c9a26b';rr(x+s*.15,by-s*.05,s*.7,s*.12,4);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.setLineDash([4,4]);ctx.lineWidth=2;rr(cx-s*.22,by-s*.4,s*.44,s*.4,3);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,247,230,.85)';ctx.fillRect(cx-s*.22,by-s*.4*f,s*.44,s*.4*f);
    ctx.strokeStyle='#8a6338';ctx.lineWidth=3;[-.26,.26].forEach(o=>{ctx.beginPath();ctx.moveTo(cx+s*o,by);ctx.lineTo(cx+s*o,by-s*.48);ctx.stroke();});
    return;
  }
  const g=.75+st*.07;
  switch(p.type){
    case 'field':{
      const rows=1+st, w=s*.72;
      ctx.fillStyle='#8a5e34';rr(cx-w/2,by-s*.5,w,s*.52,5);ctx.fill();
      for(let r=0;r<Math.min(rows,5);r++){const ry=by-s*.42+r*s*.095;
        for(let k=0;k<6;k++){const sx=cx-w/2+s*.07+k*(w-s*.14)/5, sway=Math.sin(time*2+k+r)*2;
          ctx.strokeStyle='#d9a531';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,ry+s*.05);ctx.lineTo(sx+sway,ry);ctx.stroke();
          ctx.fillStyle='#f4cf4f';ctx.beginPath();ctx.ellipse(sx+sway,ry-1,2.6,5,0,0,7);ctx.fill();}}
      if(st>=3){ctx.strokeStyle='#fff3d6';ctx.lineWidth=2;ctx.strokeRect(cx-w/2-3,by-s*.53,w+6,s*.58);}
      if(st>=5){ctx.fillStyle='#e9b949';ctx.beginPath();ctx.arc(cx+w/2-4,by-s*.5,s*.1,Math.PI,0);ctx.fill();}
      if(st>=4){ctx.fillStyle='#b5533c';ctx.fillRect(cx-2,by-s*.66,4,s*.2);ctx.fillRect(cx-s*.08,by-s*.6,s*.16,3);ctx.fillStyle='#f6d28b';ctx.beginPath();ctx.arc(cx,by-s*.68,s*.04,0,7);ctx.fill();}
      break;}
    case 'mill':{
      const w=s*.26*g, h=s*.3*g+st*s*.03;
      ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(cx,by,w*.8,w*.2,0,0,7);ctx.fill();
      ctx.fillStyle='#f3e6cf';ctx.beginPath();ctx.moveTo(cx-w/2,by);ctx.lineTo(cx-w*.32,by-h);ctx.lineTo(cx+w*.32,by-h);ctx.lineTo(cx+w/2,by);ctx.closePath();ctx.fill();
      ctx.fillStyle='#b5533c';ctx.beginPath();ctx.moveTo(cx-w*.42,by-h);ctx.lineTo(cx,by-h-w*.45);ctx.lineTo(cx+w*.42,by-h);ctx.fill();
      ctx.fillStyle='#6b4a2b';ctx.fillRect(cx-w*.12,by-h*.3,w*.24,h*.3);
      const hy=by-h-w*.1, L=s*(.22+st*.025), a0=time*(1+st*.5);
      ctx.save();ctx.translate(cx,hy);ctx.rotate(a0);for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.fillStyle=st>=4?'#fff':'#e6d3b0';ctx.fillRect(2,-3,L,6);ctx.fillStyle='rgba(181,83,60,.8)';ctx.fillRect(L*.35,-7,L*.6,7);}ctx.restore();
      ctx.fillStyle='#5a3b22';ctx.beginPath();ctx.arc(cx,hy,4,0,7);ctx.fill();
      break;}
    case 'bakery':{
      const top=house(cx,by,s*.42*g,s*(.14+st*.05),'#fff1dc','#d9774a',Math.min(st,3));
      const chx=cx+s*.12;ctx.fillStyle='#8a4a34';ctx.fillRect(chx,top+s*.12,s*.06,s*.14);
      for(let k=0;k<2+Math.min(st,3);k++){const ph=(time*.6+k*.33)%1;ctx.fillStyle=`rgba(255,255,255,${.7*(1-ph)})`;ctx.beginPath();ctx.arc(chx+s*.03+Math.sin(ph*6+k)*4,top+s*.1-ph*s*.3,3+ph*7,0,7);ctx.fill();}
      break;}
    case 'market':{
      const w=s*.5*g, h=s*(.12+st*.045);
      house(cx,by,w,h,'#fff7e6','#3f8fc4',Math.min(st,3));
      for(let k=0;k<6;k++){ctx.fillStyle=k%2?'#fff':'#e5484d';ctx.fillRect(cx-w/2-4+k*(w+8)/6,by-h*.62,(w+8)/6,8);}
      for(let k=0;k<Math.min(st,4);k++){ctx.fillStyle=['#f4b13d','#7cc36a','#e5484d','#c98a12'][k];ctx.fillRect(cx-w/2-8+k*s*.09,by-s*.06,s*.07,s*.06);}
      break;}
    case 'workshop':{
      const w=s*.48*g, h=s*(.14+st*.045);
      const top=house(cx,by,w,h,'#d8d2c4','#55606e',Math.min(st,3));
      ctx.save();ctx.translate(cx+w*.32,by-h*.75);ctx.rotate(time*1.5);ctx.fillStyle='#f5b82e';
      for(let k=0;k<8;k++){ctx.rotate(Math.PI/4);ctx.fillRect(-2,-s*.08,4,s*.04);}ctx.beginPath();ctx.arc(0,0,s*.055,0,7);ctx.fill();ctx.fillStyle='#55606e';ctx.beginPath();ctx.arc(0,0,s*.02,0,7);ctx.fill();ctx.restore();
      break;}
    case 'bank':{
      const w=s*.5*g, h=s*(.16+st*.05);
      ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(cx,by,w*.62,w*.14,0,0,7);ctx.fill();
      ctx.fillStyle='#efe8d8';ctx.fillRect(cx-w/2,by-h,w,h);
      ctx.fillStyle='#fff';for(let k=0;k<4;k++)ctx.fillRect(cx-w/2+w*.08+k*w*.25,by-h+4,w*.09,h-6);
      ctx.fillStyle='#d6cbb0';ctx.beginPath();ctx.moveTo(cx-w/2-5,by-h);ctx.lineTo(cx,by-h-w*.25);ctx.lineTo(cx+w/2+5,by-h);ctx.fill();
      if(st>=4){ctx.fillStyle='#f5b82e';ctx.beginPath();ctx.arc(cx,by-h-w*.25,w*.2,Math.PI,0);ctx.fill();}
      break;}
  }
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#5fa85a';ctx.fillRect(0,0,W,H);
  // meadow speckles
  ctx.fillStyle='rgba(255,255,255,.06)';for(let k=0;k<40;k++){const x=(k*137.5)%W,y=(k*89.3)%H;ctx.beginPath();ctx.arc(x,y,6+(k%5)*3,0,7);ctx.fill();}
  ctx.fillStyle='rgba(0,0,0,.08)';rr(gx-6,gy-6,tile*COLS+12,tile*ROWS+12,18);ctx.fill();
  for(let i=0;i<S.plots.length;i++){
    const p=S.plots[i],{x,y}=tileXY(i),pad=3;
    const pop=fx.pop[i], wob=fx.wob[i];
    const sc=1+Math.sin(pop*Math.PI)*.18+wob*.04*Math.sin(time*40);
    ctx.save();ctx.translate(x+tile/2,y+tile*.8);ctx.scale(sc,2-sc);ctx.translate(-(x+tile/2),-(y+tile*.8));
    if(p.st==='locked'){
      ctx.fillStyle='#4c8a48';rr(x+pad,y+pad,tile-pad*2,tile-pad*2,12);ctx.fill();
      tree(x+tile*.3,y+tile*.75,tile*.8);tree(x+tile*.68,y+tile*.62,tile*.7);
      if(!frontier(i)){ctx.fillStyle='rgba(30,60,30,.35)';rr(x+pad,y+pad,tile-pad*2,tile-pad*2,12);ctx.fill();}
      ctx.fillStyle='#8f8a7a';ctx.beginPath();ctx.ellipse(x+tile*.7,y+tile*.82,tile*.1,tile*.06,0,0,7);ctx.fill();
    } else {
      ctx.fillStyle=p.st==='empty'?'#c9a26b':'#86cc72';rr(x+pad,y+pad,tile-pad*2,tile-pad*2,12);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.08)';rr(x+pad,y+tile-pad-6,tile-pad*2,6,4);ctx.fill();
      if(p.st==='empty'){ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;const c=tile/2;ctx.beginPath();ctx.moveTo(x+c-8,y+c);ctx.lineTo(x+c+8,y+c);ctx.moveTo(x+c,y+c-8);ctx.lineTo(x+c,y+c+8);ctx.stroke();}
      else drawBuilding(i,p,x,y,tile);
    }
    ctx.restore();
    // progress bar + pips
    const c=cost(p);
    if(c!==null&&((p.st==='locked'&&frontier(i))||p.st==='built')){
      const bw=tile*.7,bx=x+(tile-bw)/2,byy=y+tile-15,f=Math.min(1,p.fill/c);
      ctx.fillStyle='rgba(0,0,0,.35)';rr(bx,byy,bw,8,4);ctx.fill();
      ctx.fillStyle=S.coins>=c-p.fill?'#ffd34d':'#ffe9a8';if(f>0){rr(bx,byy,Math.max(8,bw*f),8,4);ctx.fill();}
      ctx.font=`700 ${Math.max(10,tile*.12)}px Fredoka, sans-serif`;ctx.textAlign='center';ctx.fillStyle='#fff';
      ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=3;const lbl=fmt(c-p.fill);ctx.strokeText(lbl,x+tile/2,byy-4);ctx.fillText(lbl,x+tile/2,byy-4);
    }
    if(p.st==='built'&&p.stage>0){for(let k=0;k<MAXSTAGE;k++){ctx.fillStyle=k<p.stage?'#ffd34d':'rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x+tile*.12+k*7,y+tile*.12,2.6,0,7);ctx.fill();}}
    if(i===sel){ctx.strokeStyle='#fff';ctx.lineWidth=3;rr(x+pad,y+pad,tile-pad*2,tile-pad*2,12);ctx.stroke();}
    const b=fx.bub[i];
    if(b){const bx=x+tile*.78, by2=y+tile*.2+Math.sin(time*3+i)*3, r=tile*.16*Math.min(1,b.t*4);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by2,r,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(bx-4,by2+r-2);ctx.lineTo(bx,by2+r+6);ctx.lineTo(bx+4,by2+r-2);ctx.fill();
      ctx.fillStyle='#f5b82e';ctx.beginPath();ctx.arc(bx,by2,r*.6,0,7);ctx.fill();ctx.fillStyle='#8a5a00';ctx.font=`700 ${r*.8}px Fredoka, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('¢',bx,by2+1);ctx.textBaseline='alphabetic';}
  }
  // particles
  for(const q of parts){
    if(q.kind==='coin'||q.kind==='coinback'){if(q.t<0)continue;const k=Math.min(1,q.t/q.d),e=k*k;
      const mx=(q.sx+q.ex)/2+(q.kind==='coin'?q.side*40:0), my=Math.min(q.sy,q.ey)-60;
      const x=(1-k)*(1-k)*q.sx+2*(1-k)*k*mx+k*k*q.ex, y=(1-k)*(1-k)*q.sy+2*(1-k)*k*my+k*k*q.ey;
      const r=7*(q.kind==='coin'?1-.4*e:1);ctx.fillStyle='#c98a12';ctx.beginPath();ctx.ellipse(x,y+1.5,r,r*Math.abs(Math.cos(q.t*12))+1,0,0,7);ctx.fill();
      ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.ellipse(x,y,r,r*Math.abs(Math.cos(q.t*12))+1,0,0,7);ctx.fill();}
    else{const a=1-q.t/q.d;ctx.fillStyle=q.c;ctx.globalAlpha=Math.max(0,a);ctx.fillRect(q.x-3,q.y-3,6,6);ctx.globalAlpha=1;}
  }
  ctx.textAlign='center';
  for(const f of floats){ctx.globalAlpha=Math.max(0,1-f.t);ctx.font='700 18px Fredoka, sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.strokeText(f.txt,f.x,f.y-f.t*40);ctx.fillStyle='#ffe58a';ctx.fillText(f.txt,f.x,f.y-f.t*40);ctx.globalAlpha=1;}
}

// ---------- loop ----------
let prev=performance.now(), saveT=0, panelT=0;
function step(now){
  let dt=Math.min(.1,(now-prev)/1000);prev=now;time+=dt;
  // wall-clock catch-up (tab hidden / app backgrounded)
  const wall=(Date.now()-S.last)/1000;
  if(wall>5){const away=Math.min(wall,12*3600),g=totalInc()*away; if(g>0){earn(g);toast('While you were away: +'+fmt(g)+' coins');} }
  S.last=Date.now();
  earn(totalInc()*dt);

  if(hold){
    const p=S.plots[hold.i], c=cost(p);
    if(c===null||(p.st!=='locked'&&p.st!=='built')) hold=null;
    else if(hold.pause>0) hold.pause-=dt;
    else{
      hold.t+=dt;
      const need=c-p.fill, rate=Math.max(2,c*(.35+hold.t*1.1));
      const amt=Math.min(S.coins,rate*dt,need);
      if(amt>0){S.coins-=amt;p.fill+=amt;fx.wob[hold.i]=1;
        hold.emit+=dt*(18+hold.t*20);
        const s=coinSrc(),{x,y}=tileXY(hold.i);
        while(hold.emit>=1){hold.emit--;parts.push({kind:'coin',sx:s.x,sy:s.y,ex:x+tile/2+(Math.random()-.5)*tile*.3,ey:y+tile*.55,t:0,d:.45+Math.random()*.15,side:Math.random()-.5});}
        if(now-lastBlip>55){lastBlip=now;tone(380+700*(p.fill/c),.05,.035,'triangle');}
        if(p.fill>=c-1e-9){p.fill=c;levelUp(hold.i);}
      } else if(S.coins<1&&!hold.warned){hold.warned=true;toast('Out of coins. Your town keeps earning.');tone(200,.15,.04,'square');}
    }
  }
  for(let i=0;i<fx.pop.length;i++){fx.pop[i]=Math.max(0,fx.pop[i]-dt*2.2);fx.wob[i]=Math.max(0,fx.wob[i]-dt*6);
    const p=S.plots[i];
    if(p.st==='built'&&p.stage>0){
      if(fx.bub[i]) fx.bub[i].t+=dt; else if((fx.btimer[i]-=dt)<=0) fx.bub[i]={v:Math.max(5,inc(i)*12),t:0};
    }}
  for(const q of parts){q.t+=dt;if(q.kind==='spark'){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;}}
  parts=parts.filter(q=>q.t<q.d);
  for(const f of floats)f.t+=dt; floats=floats.filter(f=>f.t<1);

  $('coins').textContent=fmt(S.coins);
  $('rate').textContent=fmt(totalInc())+' / sec'+(S.seeds?' · seeds '+S.seeds:'');
  const g=festGain(); const fb=$('fest'); fb.hidden=g<1; if(g>=1&&Date.now()-festArm>3000) fb.textContent='Festival +'+g;
  if((panelT+=dt)>.25){panelT=0;renderPanel(false);}
  if((saveT+=dt)>2){saveT=0;save();}
  draw();
  requestAnimationFrame(step);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);

layout(); renderPanel(true);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(step);
})();
</script>
